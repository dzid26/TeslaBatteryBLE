# SPDX-License-Identifier: AGPL-3.0-only
name: PR paparazzi

# Fast JVM snapshots of the two battery cards (cars-list VehicleCard, car-view
# HeroCard), light AND dark, one image per state. This workflow builds pull
# request code, so it runs without secrets and with a read-only token: it
# records the 24 snapshots for the AFTER commit (HEAD), then for the BEFORE
# commit (HEAD~1, the pushed commit's parent), byte-compares the PNGs, and
# uploads only the differing ones (before/after pairs, or after-only when a
# snapshot is new or the parent predates Paparazzi) plus the PR number and the
# short SHAs as the `pr-paparazzi` artifact.
# pr-paparazzi-comment.yml posts the diffs from the default branch. One
# comment per ready revision (tagged by SHA), so flipping a PR back to ready
# after rework posts the next round's diffs instead of overwriting the
# reviewed one; draft pushes are skipped. Manual runs only record; their
# snapshots stay in the run's workspace. There are no committed goldens:
# layout changes surface as posted diffs, never as CI failures.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - '.github/workflows/pr-paparazzi.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-paparazzi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    name: Diff card snapshots
    # Skip while a PR is a draft: rework pushes do not need snapshots, and the
    # ready_for_review event posts the next review round's comment.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # HEAD plus its parent: the diff is before/after the pushed commit.
          fetch-depth: 2

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Paparazzi writes its PNGs as <package>_<class>_<method>_<name>.png;
      # only the trailing <card>_<state>_<theme>.png (hyphenated, never
      # underscores) is kept, so before/after runs compare by state even if
      # the test method around it was renamed.
      - name: Record the after snapshots
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf app/src/test/snapshots
          ./gradlew :app:recordPaparazziDebug --console=plain
          mkdir -p "$RUNNER_TEMP/after"
          count=0
          for file in app/src/test/snapshots/images/*.png; do
            base="$(basename "$file")"
            if [[ "$base" =~ (vehicle-card|hero-card)_[a-z-]+_(light|dark)\.png$ ]]; then
              cp "$file" "$RUNNER_TEMP/after/${BASH_REMATCH[0]}"
              count=$((count + 1))
            else
              echo "::warning::unexpected snapshot name: $base"
            fi
          done
          [ "$count" -gt 0 ] || { echo "::error::no card snapshots were recorded"; exit 1; }
          echo "Recorded $count after snapshots."
          git rev-parse HEAD > "$RUNNER_TEMP/after-full"
          git rev-parse --short HEAD > "$RUNNER_TEMP/after-sha"
          echo "AFTER_FULL=$(cat "$RUNNER_TEMP/after-full")" >> "$GITHUB_ENV"

      - name: Record the before snapshots
        id: before
        continue-on-error: true
        run: |
          set -euo pipefail
          shopt -s nullglob
          git checkout --quiet HEAD~1
          rm -rf app/src/test/snapshots
          ./gradlew :app:recordPaparazziDebug --console=plain
          mkdir -p "$RUNNER_TEMP/before"
          count=0
          for file in app/src/test/snapshots/images/*.png; do
            base="$(basename "$file")"
            if [[ "$base" =~ (vehicle-card|hero-card)_[a-z-]+_(light|dark)\.png$ ]]; then
              cp "$file" "$RUNNER_TEMP/before/${BASH_REMATCH[0]}"
              count=$((count + 1))
            else
              echo "::warning::unexpected snapshot name: $base"
            fi
          done
          [ "$count" -gt 0 ] || { echo "::error::no card snapshots were recorded"; exit 1; }
          echo "Recorded $count before snapshots."
          git rev-parse --short HEAD > "$RUNNER_TEMP/before-sha"

      - name: Check out the after commit back
        if: always()
        run: |
          set -euo pipefail
          git checkout --quiet "$AFTER_FULL"
          rm -rf app/src/test/snapshots

      # Hand-off to pr-paparazzi-comment.yml: the differing PNGs as
      # after/<name>.png plus before/<name>.png when the snapshot existed
      # before, the PR number, and the short SHAs of both commits. When
      # nothing differs the artifact carries an `unchanged` marker instead.
      - name: Stage the diff for the comment
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p pr-paparazzi/after pr-paparazzi/before
          changed=0
          for after in "$RUNNER_TEMP"/after/*.png; do
            name="$(basename "$after")"
            before="$RUNNER_TEMP/before/$name"
            if [ ! -f "$before" ]; then
              echo "new snapshot: $name"
              cp "$after" pr-paparazzi/after/
              changed=$((changed + 1))
            elif ! cmp -s "$after" "$before"; then
              echo "changed snapshot: $name"
              cp "$after" pr-paparazzi/after/
              cp "$before" pr-paparazzi/before/
              changed=$((changed + 1))
            fi
          done
          # The before record is best-effort: when the parent commit predates
          # Paparazzi (or its record failed) every after snapshot is new and
          # the comment shows after-only images.
          [ "${{ steps.before.outcome }}" = "success" ] || echo "::warning::before snapshots unavailable; all after snapshots count as new"
          printf '%s\n' "$PR_NUMBER" > pr-paparazzi/pr-number
          cat "$RUNNER_TEMP/after-sha" > pr-paparazzi/short-sha
          if [ -f "$RUNNER_TEMP/before-sha" ]; then
            cat "$RUNNER_TEMP/before-sha" > pr-paparazzi/before-sha
          else
            printf 'none\n' > pr-paparazzi/before-sha
          fi
          if [ "$changed" -eq 0 ]; then
            touch pr-paparazzi/unchanged
            echo "No card snapshot changed."
          else
            echo "$changed card snapshot(s) changed."
          fi

      - name: Upload the diff for the comment
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-paparazzi
          path: pr-paparazzi
          if-no-files-found: error
