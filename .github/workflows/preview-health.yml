# SPDX-License-Identifier: AGPL-3.0-only
name: Preview health

# Validates the rolling preview release: after every Android CI run on main and
# on a periodic sweep, check that the release carries its APK and screenshot
# sheet and that the sheet is not stale. A problem opens (or updates) a
# tracking issue; the issue closes itself when the release is healthy again.
on:
  workflow_run:
    workflows: [ Android CI ]
    types: [ completed ]
    branches: [ main ]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Preview release has its screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Check the preview release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          release="$(gh api "repos/$REPO/releases/tags/preview" 2>/dev/null || echo '{}')"
          assets="$(jq -r '[.assets[].name] | join(",")' <<< "$release")"
          apk="$(jq -r '[.assets[] | select(.name | startswith("TeslaBatteryBLE-preview"))][0].name // empty' <<< "$release")"
          sheet_updated="$(jq -r '[.assets[] | select(.name == "screenshot-sheet.png")][0].updated_at // empty' <<< "$release")"
          has_section="$(jq -r '.body | contains("## Screenshots")' <<< "$release")"

          problem=""
          if [ -z "$apk" ]; then problem="the preview APK asset is missing"; fi
          if [ -z "$sheet_updated" ]; then problem="${problem:+$problem; }screenshot-sheet.png is missing"; fi
          if [ "$has_section" != "true" ]; then problem="${problem:+$problem; }the notes have no Screenshots section"; fi

          head_date="$(gh api "repos/$REPO/commits/main" --jq '.commit.committer.date')"
          if [ -n "$sheet_updated" ]; then
            age=$(( $(date -u -d "$head_date" +%s) - $(date -u -d "$sheet_updated" +%s) ))
            if [ "$age" -gt 7200 ]; then
              problem="${problem:+$problem; }the sheet is stale (last updated $sheet_updated, main is at $head_date)"
            fi
          fi

          echo "assets=$assets sheet_updated=${sheet_updated:-none} head=$head_date problem=${problem:-none}"

          title="Preview release is missing screenshots"
          existing="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"

          if [ -n "$problem" ]; then
            body="$(printf 'The rolling preview release is not healthy:\n\n- %s\n\nChecked: %s\nRelease: https://github.com/%s/releases/tag/preview\n' "$problem" "$(date -u +%FT%TZ)" "$REPO")"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" --body "$body"
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body"
            fi
            exit 1
          fi

          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" --comment "The preview release is healthy again ($(date -u +%FT%TZ))."
          fi
