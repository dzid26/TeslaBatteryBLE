name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests (:core)
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: teslable-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Release APK on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk

  preview:
    name: Rolling preview release
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: preview-release
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: teslable-debug-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on emulator
        continue-on-error: true
        timeout-minutes: 15
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 420
          disable-animations: true
          script: bash .github/scripts/capture-screenshots.sh dist/app-debug.apk screenshots

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-preview-release.sh

  go-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone vehicle-command
        run: git clone --depth 1 https://github.com/teslamotors/vehicle-command.git /tmp/vehicle-command

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/vehicle-command/go.mod

      - name: Generate fixtures from the Go runtime
        run: |
          mkdir -p /tmp/vehicle-command/fixtures
          cp tools/go-fixtures/main.go /tmp/vehicle-command/fixtures/main.go
          cd /tmp/vehicle-command
          go run ./fixtures > /tmp/fixtures.txt

      - name: Compare deterministic fixtures
        run: |
          grep -E '^(CLIENT_PRIVATE_PKCS8|CLIENT_PUBLIC|VEHICLE_PUBLIC|SESSION_INFO|CHALLENGE|SESSION_INFO_TAG|RESPONSE_REQUEST_ID|RESPONSE_PLAINTEXT)=' /tmp/fixtures.txt > /tmp/got.txt
          diff tools/go-fixtures/expected.txt /tmp/got.txt
