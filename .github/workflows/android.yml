# SPDX-License-Identifier: AGPL-3.0-only
name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - 'fastlane/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - 'fastlane/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Main runs are never cancelled: the preview capture needs ~15 minutes and
  # rapid pushes would otherwise kill it before it can publish. Only PR runs
  # are superseded; queued previews collapse in the preview job below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Secrets only reach jobs that run trusted code. `build` runs for pull requests
# and pushes without secrets and signs with the default debug key. `release`
# (v* tags) and `preview` (main) take the signing key and ATTACHMENTS_TOKEN
# from the `release` environment and build the signed APK themselves.
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history and tags: versionName is derived from git describe

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Optional shared key for CI debug builds, so each PR build updates the
      # previous one in place. It is a throwaway debug key, so it lives in a
      # repository variable, not a secret; without it every run signs with a
      # fresh debug key.
      - name: Set up the shared CI debug key
        if: vars.CI_DEBUG_KEYSTORE_BASE64 != ''
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ vars.CI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          dir="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$dir"
          # Values pasted on Windows end in CRLF, and some encoders wrap lines.
          printf '%s' "$CI_DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$dir/debug.keystore"

      - name: Unit tests (:core)
        run: ./gradlew :core:test

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Static analysis (ktlint, detekt)
        run: ./gradlew ktlintCheck detekt

      # The artifact gets its own application ID (.pr), launcher label and a
      # versionName ending in -pr<number>, so it installs next to the release
      # app. The preview and release jobs and the screenshot captures build
      # without the property.
      - name: Build debug APK
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./gradlew :app:assembleDebug -PciDebugBuild=true -PciPrNumber="$PR_NUMBER"

      # The APK name says which PR and commit it came from; the artifact name
      # stays fixed because the screenshot comment looks it up.
      - name: Name the debug APK
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk "dist-apk/TeslaBatteryBLE-${PR_NUMBER:+pr$PR_NUMBER-}${HEAD_SHA:0:7}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teslable-debug-apk
          path: dist-apk/*.apk

  release:
    name: Tag release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history and tags: versionName is derived from git describe

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Never publish a debug-key build: fail when the release environment
          # does not provide the signing secrets.
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set in the release environment"
              exit 1
            fi
          done
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > keystore.properties

      - name: Build the signed debug APK
        run: ./gradlew :app:assembleDebug

      # Tag releases capture their own screenshots from the simulated car.
      - name: Stage the release APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/TeslaBatteryBLE-${GITHUB_REF_NAME}.apk"

      - name: Build the demo APK for screenshots
        run: ./gradlew :app:assembleDebug -PdemoCar=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots
        id: capture
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          disable-animations: true
          script: bash .github/scripts/capture-screenshots.sh app/build/outputs/apk/debug/app-debug.apk screenshots

      # Emulator flakes (GL context preemption, adb daemon) are common on CI
      # runners; give the capture one fresh attempt. The publish script below
      # still fails the job when no complete set is produced, so a release is
      # never published without its screenshots.
      - name: Retry the capture once
        if: steps.capture.outcome == 'failure'
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          disable-animations: true
          script: rm -rf screenshots && bash .github/scripts/capture-screenshots.sh app/build/outputs/apk/debug/app-debug.apk screenshots

      - name: Release on tag
        env:
          GH_TOKEN: ${{ github.token }}
          ATTACHMENTS_TOKEN: ${{ secrets.ATTACHMENTS_TOKEN }}
        run: bash .github/scripts/publish-tag-release.sh

      # Release bot: point the committed screenshots (README + website) at the
      # build that was just released. Tags only, commits to main, and only when
      # a PNG actually changed; website/** is ignored by Android CI, so the
      # commit does not rebuild the app or the rolling preview.
      - name: Refresh the committed screenshots
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B release-shots origin/main
          changed=false
          for name in 02-scanning 03-car 05-settings \
              02-scanning-dark 03-car-dark 05-settings-dark; do
            if [ -f "screenshots/$name.png" ] && ! cmp -s "screenshots/$name.png" "website/images/$name.png"; then
              cp "screenshots/$name.png" "website/images/$name.png"
              changed=true
            fi
          done
          if [ "$changed" != true ]; then
            echo "screenshots unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/images
          git commit -m "Refresh screenshots from ${{ github.ref_name }}"
          git push origin HEAD:main

  preview:
    name: Rolling preview release
    needs: build
    environment: release
    permissions:
      contents: write
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: preview-release
      # Let the in-flight capture finish; newer pending previews replace older
      # pending ones, so the newest build still wins without killing the capture.
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Never publish a debug-key build: fail when the release environment
          # does not provide the signing secrets.
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set in the release environment"
              exit 1
            fi
          done
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > keystore.properties

      - name: Build the signed debug APK
        run: ./gradlew :app:assembleDebug

      - name: Stage the preview APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk

      # The preview captures its own screenshots from the simulated car.
      - name: Build the demo APK for screenshots
        run: ./gradlew :app:assembleDebug -PdemoCar=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots
        id: capture
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          disable-animations: true
          script: bash .github/scripts/capture-screenshots.sh app/build/outputs/apk/debug/app-debug.apk screenshots

      # Emulator flakes (GL context preemption, adb daemon) are common on CI
      # runners; give the capture one fresh attempt. The publish script below
      # still fails the job when no complete set is produced, so a release is
      # never published without its screenshots.
      - name: Retry the capture once
        if: steps.capture.outcome == 'failure'
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          disable-animations: true
          script: rm -rf screenshots && bash .github/scripts/capture-screenshots.sh app/build/outputs/apk/debug/app-debug.apk screenshots

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTACHMENTS_TOKEN: ${{ secrets.ATTACHMENTS_TOKEN }}
        run: bash .github/scripts/publish-preview-release.sh

  go-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The oracle is the vehicle-command commit the protos are pinned to, not
      # upstream HEAD: moving it is a deliberate TESLA_COMMIT bump.
      - name: Check out vehicle-command at TESLA_COMMIT
        run: |
          git init -q /tmp/vehicle-command
          git -C /tmp/vehicle-command fetch -q --depth 1 \
            https://github.com/teslamotors/vehicle-command.git "$(cat core/src/main/proto/TESLA_COMMIT)"
          git -C /tmp/vehicle-command checkout -q FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: /tmp/vehicle-command/go.mod

      - name: Generate fixtures from the Go runtime
        run: |
          mkdir -p /tmp/vehicle-command/fixtures
          cp tools/go-fixtures/main.go /tmp/vehicle-command/fixtures/main.go
          cd /tmp/vehicle-command
          go run ./fixtures > /tmp/fixtures.txt

      # Keys, nonces and the session clock are fixed, so every line is
      # deterministic and the whole output is compared.
      - name: Compare fixtures
        run: diff tools/go-fixtures/expected.txt /tmp/fixtures.txt
