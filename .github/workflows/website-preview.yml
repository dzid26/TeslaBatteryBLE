# SPDX-License-Identifier: AGPL-3.0-only
name: Website preview

# Render the static site for pull requests that touch it, so website changes
# can be reviewed without checking out. This workflow renders pull request
# content, so it runs without secrets and with a read-only token: it uploads
# the render, the PR number and the short SHA as the `website-preview`
# artifact, and website-preview-comment.yml posts it from the default branch.
# One comment per ready revision (tagged by SHA); draft PRs are skipped.
# Manual runs only render; the image stays in the run's artifacts.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'website/**'
      - '.github/workflows/website-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Render the website preview
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Render the site
        run: |
          set -euo pipefail
          npx --yes playwright@latest install --with-deps chromium > /dev/null
          python3 -m http.server 8099 --directory website &
          server=$!
          trap 'kill $server' EXIT
          sleep 2
          npx --yes playwright@latest screenshot --full-page \
            --viewport-size=1280,900 --wait-for-timeout=1500 \
            http://127.0.0.1:8099/index.html website-preview.png
          ls -l website-preview.png

      # Hand-off to website-preview-comment.yml: only the render, the PR number
      # (empty on manual runs, which nothing posts) and the short SHA of the
      # rendered commit.
      - name: Stage the preview for the comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p website-preview
          cp website-preview.png website-preview/website-preview.png
          printf '%s\n' "$PR_NUMBER" > website-preview/pr-number
          git rev-parse --short HEAD > website-preview/short-sha

      - name: Upload the preview for the comment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-preview
          path: website-preview
          if-no-files-found: error
