# SPDX-License-Identifier: AGPL-3.0-only
name: Demo smoke

# Manual + daily canary: drives the simulated car on an emulator and captures
# screenshots. Unit tests and the APK build run in Android CI, so this workflow
# intentionally has no test job of its own. The schedule catches capture-script
# drift against UI changes before a release needs it.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: write # the refresh step commits screenshots back to main

concurrency:
  # Never cancel a capture mid-flight; a queued run waits instead.
  group: demo-smoke
  cancel-in-progress: false

jobs:
  demo:
    name: Simulated car on emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the demo APK
        run: ./gradlew :app:assembleDebug -PdemoCar=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Mirror the Android CI capture environment: run the emulator headless.
      # The windowed default never renders the app on CI runners, so the scan
      # results and every screenshot were missing.
      - name: Drive the simulated car and capture screenshots
        id: capture
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/capture-screenshots.sh app/build/outputs/apk/debug/app-debug.apk demo-screenshots

      # Emulator flakes (GL context preemption, adb daemon) are common on CI
      # runners; give the capture one fresh attempt like Android CI does. The
      # assert below still fails the job when no complete set is produced.
      - name: Retry the capture once
        if: steps.capture.outcome == 'failure'
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: rm -rf demo-screenshots && bash .github/scripts/capture-screenshots.sh app/build/outputs/apk/debug/app-debug.apk demo-screenshots

      - name: Assert the screenshots
        run: |
          set -euo pipefail
          missing=""
          for name in 01-overview 02-scanning 03-car 04-history 05-settings \
              01-overview-dark 02-scanning-dark 03-car-dark 04-history-dark 05-settings-dark; do
            if [ ! -f "demo-screenshots/$name.png" ]; then
              echo "missing required screenshot: $name.png"
              missing=true
            fi
          done
          [ -z "$missing" ]

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demo-screenshots
          path: demo-screenshots
          if-no-files-found: warn

      # Release bot: keep the committed screenshots (README + website) in sync
      # with the demo build. Only on main, and only when a PNG actually
      # changed; website/** is ignored by Android CI, so this does not rebuild
      # the app or the rolling preview.
      - name: Refresh the committed screenshots
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          changed=false
          for name in 01-overview 02-scanning 03-car 04-history 05-settings \
              01-overview-dark 02-scanning-dark 03-car-dark 04-history-dark 05-settings-dark; do
            if ! cmp -s "demo-screenshots/$name.png" "website/images/$name.png"; then
              cp "demo-screenshots/$name.png" "website/images/$name.png"
              changed=true
            fi
          done
          if [ "$changed" != true ]; then
            echo "screenshots unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/images
          git commit -m "Refresh screenshots from the demo capture"
          git push
