# SPDX-License-Identifier: AGPL-3.0-only
name: PR screenshots

# Capture the demo build on pull requests that touch the app UI or the capture
# flow and post the screenshot sheet in one sticky bot comment, so reviews see
# the visual result. The sheet is hosted as a user attachment, so neither the PR
# nor the releases carry image assets, and the comment is updated on every push.
# Note: PRs from forks get a read-only token, so the upload/comment steps fail
# there by design.
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/scripts/capture-screenshots.sh'
      - '.github/scripts/build-screenshot-sheet.sh'
      - '.github/scripts/upload-screenshot.sh'
      - '.github/workflows/pr-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write      # upload the sheet to the pr-shots release
  pull-requests: write # post/update the comment

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture and post screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the demo APK
        run: ./gradlew :app:assembleDebug -PdemoCar=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      # Same headless environment as the Android CI capture: the windowed
      # default never renders the app on CI runners.
      - name: Capture screenshots
        id: capture
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/capture-screenshots.sh app/build/outputs/apk/debug/app-debug.apk screenshots

      # Emulator flakes (GL context preemption, adb daemon) are common on CI
      # runners; give the capture one fresh attempt like Android CI does. The
      # assert below still fails the job when no complete set is produced.
      - name: Retry the capture once
        if: steps.capture.outcome == 'failure'
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: rm -rf screenshots && bash .github/scripts/capture-screenshots.sh app/build/outputs/apk/debug/app-debug.apk screenshots

      - name: Assert the screenshots
        run: |
          set -euo pipefail
          missing=""
          for name in 02-scanning 03-car 05-settings \
              02-scanning-dark 03-car-dark 05-settings-dark; do
            if [ ! -f "screenshots/$name.png" ]; then
              echo "missing required screenshot: $name.png"
              missing=true
            fi
          done
          [ -z "$missing" ]

      - name: Compose the screenshot sheet
        run: bash .github/scripts/build-screenshot-sheet.sh screenshots screenshots/screenshot-sheet.png

      # Keep the capture diagnostics (window XML, logcat tail, screenshots) when
      # a capture fails, so the next flake is debuggable.
      - name: Upload the capture diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-screenshots-capture
          path: screenshots
          if-no-files-found: warn

      - name: Resolve the pull request number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="${{ github.event.pull_request.number }}"
          if [ -z "$number" ]; then
            number="$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number // empty')"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Host the sheet as a user attachment (release-asset fallback inside the
      # helper), so no image asset lives on the PR or the releases.
      - name: Upload the screenshot sheet
        id: sheet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          url="$(bash .github/scripts/upload-screenshot.sh screenshots/screenshot-sheet.png "screenshot-sheet-$short.png" screenshots)"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment on the pull request
        if: steps.pr.outputs.number != ''
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            <!-- pr-screenshots -->
            ## Screenshots

            ![App screenshots: light and dark](${{ steps.sheet.outputs.url }})

            Captured from the demo build at ${{ steps.sheet.outputs.short }}.
          comment-tag: pr-screenshots
          pr-number: ${{ steps.pr.outputs.number }}
          github-token: ${{ github.token }}
