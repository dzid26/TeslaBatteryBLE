# SPDX-License-Identifier: AGPL-3.0-only
name: PR screenshots

# Manual full-screen emulator fallback: captures the demo build on an emulator
# (cars list, car view, settings x light/dark) when a review needs the real
# rendered app rather than a card snapshot. Pull requests use pr-paparazzi.yml
# by default; this workflow runs only when dispatched by hand, needs no
# secrets, and leaves its screenshots in the run's artifacts (manual runs
# have no PR, so pr-screenshots-comment.yml never fires for them).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture screenshots
    # Skip while a PR is a draft: rework pushes do not need screenshots, and the
    # ready_for_review event posts the next review round's comment.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    # Pinned: the emulator, KVM and adb steps are not yet validated on ubuntu-latest
    # (migrating to Ubuntu 26 on 2026-10-19).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the demo APK
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./gradlew :app:assembleDebug -PdemoCar=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same headless environment as the Android CI capture: the windowed
      # default never renders the app on CI runners.
      - name: Capture screenshots
        id: capture
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/capture-screenshots.sh app/build/outputs/apk/debug/app-debug.apk screenshots

      # Emulator flakes (GL context preemption, adb daemon) are common on CI
      # runners; give the capture one fresh attempt like Android CI does. The
      # assert below still fails the job when no complete set is produced.
      - name: Retry the capture once
        if: steps.capture.outcome == 'failure'
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: rm -rf screenshots && bash .github/scripts/capture-screenshots.sh app/build/outputs/apk/debug/app-debug.apk screenshots

      - name: Assert the screenshots
        run: |
          set -euo pipefail
          missing=""
          for name in 02-scanning 03-car 05-settings \
              02-scanning-dark 03-car-dark 05-settings-dark; do
            if [ ! -f "screenshots/$name.png" ]; then
              echo "missing required screenshot: $name.png"
              missing=true
            fi
          done
          [ -z "$missing" ]

      # Keep the capture diagnostics (window XML, logcat tail, screenshots) when
      # a capture fails, so the next flake is debuggable.
      - name: Upload the capture diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-screenshots-capture
          path: screenshots
          if-no-files-found: warn

      # Hand-off to pr-screenshots-comment.yml: only the six screenshots, the
      # PR number and the short SHA of the captured commit.
      - name: Stage the screenshots for the comment
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p pr-screenshots
          for name in 02-scanning 03-car 05-settings \
              02-scanning-dark 03-car-dark 05-settings-dark; do
            cp "screenshots/$name.png" "pr-screenshots/$name.png"
          done
          printf '%s\n' "$PR_NUMBER" > pr-screenshots/pr-number
          git rev-parse --short HEAD > pr-screenshots/short-sha

      - name: Upload the screenshots for the comment
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-screenshots
          path: pr-screenshots
          if-no-files-found: error
