name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that the app doesn't support today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Note: the project is local-first by design — features that require cloud
        accounts, telemetry, or sending vehicle data off the phone are out of scope
        for the core app. See the [master plan](https://github.com/dzid26/TeslaBatteryBLE/blob/main/docs/master-plan.md).
