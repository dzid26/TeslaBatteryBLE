//
// TeslaBatteryBLE's own history envelope (ADR-0008): every BLE reply the app
// logs is wrapped in one BleRecord. Tesla's protos live in ../proto, vendored
// verbatim; this file is ours, so a re-vendor never touches it.
//
// Evolution rules (the logs are append-only, so old records must keep reading):
//  - New fields and new oneof payload kinds only get new field numbers. Old
//    records read them as absent; older app versions skip them as unknown.
//  - Never renumber, reuse or retype a field. A removed field's number and
//    name go under `reserved`.
//  - Never move an existing field into or out of the oneof.
//  - New scalar fields use proto3 `optional`, so absent differs from zero.

syntax = "proto3";

package teslable.history;

import "google/protobuf/timestamp.proto";
import "vcsec.proto";
import "vehicle.proto";

option java_package = "com.dzid26.teslable.core.history";

// One reply the phone acquired over BLE, kept verbatim. Fields follow a
// reading's order: time, VCSEC status, charge, drive.
message BleRecord {
    // Phone clock when the reply arrived. A car timestamp inside the payload
    // (ChargeState.timestamp, DriveState.timestamp) is never touched.
    google.protobuf.Timestamp acquired_at = 1;

    oneof payload {
        VCSEC.VehicleStatus vehicle_status = 2;
        CarServer.ChargeState charge_state = 3;
        CarServer.DriveState drive_state = 4;
    }
}
